services:
  postgres:
    image: postgres:18
    restart: "no"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_NAME}
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${POSTGRES_USER}"]
      timeout: 5s
      interval: 10s
      retries: 3
    ports:
      - ${POSTGRES_PORT}:5432
    volumes:
      - ${POSTGRES_VOLUME_PATH}:/var/lib/postgresql

  redis:
    image: redis:8.6.2-alpine
    restart: "no"
    ports:
      - ${REDIS_PORT}:6379
    command: redis-server --appendonly yes
    volumes:
      - ${REDIS_VOLUME_PATH}:/data

  papercut:
    image: changemakerstudiosus/papercut-smtp:latest
    restart: "no"
    environment:
      PAPERCUT_ADMIN_USERNAME: ${PAPERCUT_USERNAME}
      PAPERCUT_ADMIN_PASSWORD: ${PAPERCUT_PASSWORD}
    ports:
      - ${PAPERCUT_WEB_PORT}:80
      - ${PAPERCUT_PORT}:25

  rustfs-perms:
    image: alpine
    restart: "no"
    user: root
    volumes:
      - ${RUSTFS_VOLUME_PATH}:/data
    command: chown -R 10001:10001 /data

  rustfs:
    image: rustfs/rustfs:latest
    restart: "no"
    depends_on:
      rustfs-perms:
        condition: service_completed_successfully
    environment:
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY}
    healthcheck:
      test: ["CMD", "sh", "-c", "curl -f http://localhost:9000/health && curl -f http://localhost:9001/rustfs/console/health"]
      timeout: 5s
      interval: 10s
      retries: 3
    ports:
      - ${RUSTFS_PORT}:9000
      - ${RUSTFS_CONSOLE_PORT}:9001
    volumes:
      - ${RUSTFS_VOLUME_PATH}:/data
