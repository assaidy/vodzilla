services:
  postgres:
    image: postgres:18
    restart: "no"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_NAME}
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${POSTGRES_USER}"]
      interval: 5s
      retries: 5
    ports:
      - ${POSTGRES_PORT}:5432
    volumes:
      - ${POSTGRES_VOLUME_PATH}:/var/lib/postgresql

  redis:
    image: redis:8.6.2-alpine
    restart: "no"
    ports:
      - ${REDIS_PORT}:6379
    command: redis-server --appendonly yes
    volumes:
      - ${REDIS_VOLUME_PATH}:/data

  papercut:
    image: changemakerstudiosus/papercut-smtp:latest
    restart: "no"
    environment:
      PAPERCUT_ADMIN_USERNAME: ${PAPERCUT_USERNAME}
      PAPERCUT_ADMIN_PASSWORD: ${PAPERCUT_PASSWORD}
    ports:
      - ${PAPERCUT_WEB_PORT}:80
      - ${PAPERCUT_PORT}:25
