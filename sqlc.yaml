version: "2"

sql:
  - engine: "postgresql"
    schema: "./internals/services/user/db/migrations/"
    queries: "./internals/services/user/db/queries.sql"
    gen:
      go: &go-base
        package: "queries"
        out: "./internals/services/user/queries/"
        emit_prepared_queries: true
        emit_empty_slices: true
        initialisms: []

  - engine: "postgresql"
    schema: "./internals/services/video/db/migrations/"
    queries: "./internals/services/video/db/queries.sql"
    gen:
      go:
        <<: *go-base
        out: "./internals/services/video/queries/"

  - engine: "postgresql"
    schema: "./internals/services/media/db/migrations/"
    queries: "./internals/services/media/db/queries.sql"
    gen:
      go:
        <<: *go-base
        out: "./internals/services/media/queries/"

  - engine: "postgresql"
    schema: "./internals/services/reaction/db/migrations/"
    queries: "./internals/services/reaction/db/queries.sql"
    gen:
      go:
        <<: *go-base
        out: "./internals/services/reaction/queries/"

  - engine: "postgresql"
    schema: "./internals/services/social/db/migrations/"
    queries: "./internals/services/social/db/queries.sql"
    gen:
      go:
        <<: *go-base
        out: "./internals/services/social/queries/"

  - engine: "postgresql"
    schema: "./internals/services/notification/db/migrations/"
    queries: "./internals/services/notification/db/queries.sql"
    gen:
      go:
        <<: *go-base
        out: "./internals/services/notification/queries/"
