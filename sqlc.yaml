version: "2"
overrides:
  go:
    overrides:
      - db_type: "uuid"
        go_type:
          import: "github.com/oklog/ulid/v2"
          type: "ULID"
sql:
  - engine: "postgresql"
    schema: "./internals/services/auth/db/migrations/"
    queries: "./internals/services/auth/db/queries.sql"
    gen:
      go:
        package: "queries"
        out: "./internals/services/auth/queries/"
        emit_prepared_queries: true
        emit_empty_slices: true
